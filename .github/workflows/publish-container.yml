name: Publish container to GHCR

on:
  push:
    branches: [main]

concurrency:
  group: publish-ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and smoke-test the Linux image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" .
          docker run --rm --entrypoint codex "${image}:${GITHUB_SHA}" --version
          docker run --rm --network none \
            -v "$PWD/apps/server/testdata/hey-hank.wav:/test.wav:ro" \
            "${image}:${GITHUB_SHA}" --check-wake /test.wav

      - name: Publish commit and latest tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${image}:${GITHUB_SHA}"
          docker tag "${image}:${GITHUB_SHA}" "${image}:latest"
          docker push "${image}:latest"
